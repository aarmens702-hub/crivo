name: ci

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - name: Sync environment
        run: uv sync --dev
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Tests (keyless suite; container tests are opt-in)
        run: uv run pytest -q
      - name: Fresh install (what users get, no lock)
        run: |
          uv venv --python 3.12 .fresh
          uv pip install --python .fresh/bin/python . pytest hypothesis jinja2
          .fresh/bin/python -c "import crivo.loop, crivo.mcp_server"
          .fresh/bin/python -m pytest -q -p no:cacheprovider tests/test_packaging.py tests/test_llm.py tests/test_mcp_server.py tests/test_ask.py tests/test_a0_feel.py
      - name: Bench smoke (instrument invariants; external datasets absent in CI)
        run: uv run python -m bench.run --smoke
